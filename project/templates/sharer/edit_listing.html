{% extends "base.html" %}

{% block content %}

<div class="form-container">
    <div class="form-card">

        <h2 class="form-title">Edit Listing</h2>

        <form method="POST">

            <div class="form-group">
                <label>Title</label>
                <input name="title" value="{{ listing.title }}">
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea name="description">{{ listing.description }}</textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Weekly Price</label>
                    <input name="weekly_price" type="number" step="0.01"
                           value="{{ listing.weekly_price }}">
                </div>

                <div class="form-group">
                    <label>Available Rooms</label>
                    <input name="available_rooms" type="number"
                           value="{{ listing.available_rooms }}">
                </div>
            </div>

            <div class="form-group form-checkbox">
                <input type="checkbox" name="bills_included"
                    {% if listing.bills_included %}checked{% endif %}>
                <span>Bills included</span>
            </div>

            <div class="form-group">
                <label>Preferred Gender</label>
                <select name="preferred_gender">
                    <option value="any" {% if listing.preferred_gender == 'any' %}selected{% endif %}>Any</option>
                    <option value="male" {% if listing.preferred_gender == 'male' %}selected{% endif %}>Male</option>
                    <option value="female" {% if listing.preferred_gender == 'female' %}selected{% endif %}>Female</option>
                </select>
            </div>

            <button type="submit" class="form-btn">Save Changes</button>

        </form>

    </div>
</div>

{% endblock %}
