{% extends "base.html" %}

{% block content %}

<div class="form-container">
    <div class="form-card">

        <h2 class="form-title">Edit Property</h2>

        <form method="POST">

            <div class="form-group">
                <label>Address</label>
                <input name="address" value="{{ property.address }}" placeholder="Address">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Suburb</label>
                    <input name="suburb" value="{{ property.suburb }}" placeholder="Suburb">
                </div>

                <div class="form-group">
                    <label>State</label>
                    <input name="state" value="{{ property.state }}" placeholder="State">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Bedrooms</label>
                    <input name="bedrooms" type="number" value="{{ property.bedrooms }}" placeholder="Bedrooms">
                </div>

                <div class="form-group">
                    <label>Bathrooms</label>
                    <input name="bathrooms" type="number" value="{{ property.bathrooms }}" placeholder="Bathrooms">
                </div>
            </div>

            <div class="form-group form-checkbox">
                <input type="checkbox" name="pet_friendly"
                    {% if property.pet_friendly %}checked{% endif %}>
                <span>Pet Friendly</span>
            </div>

            <div class="form-group">
                <label>Lifestyle Type</label>
                <select name="lifestyle_type">
                    <option value="">Select lifestyle</option>
                    <option value="quiet" {% if property.lifestyle_type == 'quiet' %}selected{% endif %}>Quiet</option>
                    <option value="social" {% if property.lifestyle_type == 'social' %}selected{% endif %}>Social</option>
                </select>
            </div>

            <div class="form-group">
                <label>Property Type</label>
                <select name="property_type">
                    <option value="">Select property type</option>
                    <option value="apartment" {% if property.property_type == 'apartment' %}selected{% endif %}>Apartment</option>
                    <option value="house" {% if property.property_type == 'house' %}selected{% endif %}>House</option>
                    <option value="unit" {% if property.property_type == 'unit' %}selected{% endif %}>Unit</option>
                    <option value="granny_flat" {% if property.property_type == 'granny_flat' %}selected{% endif %}>Granny Flat</option>
                </select>
            </div>

            <div class="form-group">
                <label>Image URL</label>
                <input name="image_url" value="{{ property.image_url }}" placeholder="Image URL">
            </div>

            <button type="submit" class="form-btn">Save Property</button>

        </form>

    </div>
</div>

{% endblock %}
